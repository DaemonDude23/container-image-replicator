name: Package Application with Nuitka
"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: src/requirements.txt
      - name: Install Dependencies
        run: python -m pip install -r src/requirements.txt
      - name: Build Executable
        uses: Nuitka/Nuitka-Action@v1.3
        with:
          nuitka-version: 4.2.2
          mode: onefile
          script-name: container-image-replicator.py
          working-directory: src
      - name: Rename binary for macOS
        if: runner.os == 'macOS'
        run: mv src/build/container-image-replicator.bin src/build/container-image-replicator.macos
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ runner.os }}
          path: |
            src/build/container-image-replicator.bin
            src/build/container-image-replicator.exe
            src/build/container-image-replicator.macos
          if-no-files-found: error
